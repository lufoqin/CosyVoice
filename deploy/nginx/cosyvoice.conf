server {
    listen 80;
    server_name tts.intra.example;

    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    client_max_body_size 50m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location /_cosyvoice_downloads/ {
        internal;
        alias /var/lib/cosyvoice/batches/;
        default_type application/zip;
    }

    location / {
        return 404;
    }
}
